name: Build and Release OBS Plugin

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_NAME: raw-tcp-udp-output
  OBS_VERSION: 30.2.3

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v4

      - name: Checkout obs-studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          path: obs-studio

      # The official Windows OBS installer ships no headers or import
      # libraries, so build libobs from source. -DOBS_CMAKE_VERSION=3.0.0
      # selects the modern build system, which downloads the prebuilt
      # obs-deps automatically during configure.
      - name: Configure libobs
        run: cmake -S obs-studio -B obs-build -A x64 -DOBS_CMAKE_VERSION=3.0.0 -DENABLE_PLUGINS=OFF -DENABLE_UI=OFF -DENABLE_SCRIPTING=OFF

      # obs-frontend-api must be built as well: its install rules are part
      # of the same Development component even with ENABLE_UI=OFF, and
      # installing that component fails if the DLL was never built.
      - name: Build libobs
        run: cmake --build obs-build --config Release --target libobs obs-frontend-api --parallel

      - name: Install libobs
        run: cmake --install obs-build --config Release --component Development --prefix "${{ github.workspace }}/libobs-dist"

      # Diagnostic aid while the pipeline stabilizes; safe to delete later.
      - name: List installed CMake packages
        shell: pwsh
        run: Get-ChildItem -Recurse libobs-dist -Filter *.cmake | ForEach-Object FullName

      # obs-studio installs its CMake packages under <prefix>/cmake/<name>/,
      # which find_package() does not search relative to <prefix>; adding
      # <prefix>/cmake as its own prefix entry makes them discoverable.
      - name: Configure Plugin
        run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/libobs-dist;${{ github.workspace }}/libobs-dist/cmake"

      - name: Build Plugin
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/obs-plugins/64bit, "package/data/obs-plugins/$env:PLUGIN_NAME", package/tools | Out-Null
          Copy-Item "build/Release/$env:PLUGIN_NAME.dll" package/obs-plugins/64bit/
          Copy-Item -Recurse data/locale "package/data/obs-plugins/$env:PLUGIN_NAME/locale"
          Copy-Item tools/obs_raw_output_control.lua package/tools/
          Copy-Item tools/raw_video_server.py package/tools/
          Compress-Archive -Path package/* -DestinationPath "$env:PLUGIN_NAME-windows-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows
          path: ${{ env.PLUGIN_NAME }}-windows-x64.zip

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
